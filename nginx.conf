server {
    listen $PORT;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Performance: keep-alive & sendfile
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression — aggressive
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # HTML pages — short cache, always revalidate
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    # Images — long cache
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|avif)$ {
        expires 90d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS, JS — long cache
    location ~* \.(css|js)$ {
        expires 60d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Video/media — long cache
    location ~* \.(mp4|webm|ogg|mp3|wav)$ {
        expires 90d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Fonts — long cache
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # Block admin from crawlers
    location = /admin.html {
        add_header X-Robots-Tag "noindex, nofollow";
    }
}
